<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="KST"><title>KST · Kopfschmerztagebuch</title><style>
:root{color-scheme:dark;--bg:#08090d;--panel:#17191f;--panel2:#22252d;--edge:#323640;--text:#f5f5f7;--sub:#a2a6b2;--blue:#0a84ff;--soft:#172b44;--green:#30d398;--red:#ff6969}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.42}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}header{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 23px) 20px 10px}h1{font-size:33px;letter-spacing:-1px;margin:0}h2{font-size:23px;letter-spacing:-.4px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}.muted{color:var(--sub)}.small{font-size:13px}.eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--sub);font-weight:700}main{max-width:760px;margin:auto;padding:8px 16px calc(110px + env(safe-area-inset-bottom))}.card{background:var(--panel);border:1px solid #272a33;border-radius:22px;padding:19px;margin:0 0 13px;box-shadow:0 3px 16px #0002}.hero{padding:23px}.btn{border:0;border-radius:14px;background:var(--blue);color:white;padding:14px 16px;font-weight:650;min-height:48px}.btn.secondary{background:#30343d;color:var(--text)}.btn.ghost{background:transparent;color:#7dbaff;border:1px solid var(--edge)}.btn.danger{background:#4b242a;color:#ffaaaa}.btn.full{width:100%}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{border:1px solid var(--edge);background:#262932;color:var(--text);border-radius:15px;min-height:53px;padding:12px 10px;text-align:center;font-weight:550}.choice.selected{background:var(--soft);border:2px solid var(--blue);color:#c6e4ff;padding:11px 9px}.choice.tiny{min-height:42px;padding:9px}.choice.tiny.selected{padding:8px}.label{display:block;font-size:13px;font-weight:650;color:#c8cbd4;margin:14px 0 7px}input,textarea,select{background:#262932;color:var(--text);border:1px solid #424650;border-radius:12px;padding:12px;width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue)}textarea{min-height:82px;resize:vertical}.pill{display:inline-block;background:#292d36;border-radius:999px;padding:5px 9px;font-size:12px;color:#d1d3dc;margin:3px 3px 0 0}.pill.blue{background:#193554;color:#8bc6ff}.pill.green{background:#173d34;color:#78e6bb}.stepbar{height:5px;border-radius:8px;background:#343741;overflow:hidden;margin:12px 0 22px}.stepbar div{height:100%;background:var(--blue);transition:width .2s}.nav{position:fixed;bottom:0;left:0;right:0;background:#13151bed;border-top:1px solid #30323a;backdrop-filter:blur(18px);padding:10px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}.nav-inner{width:100%;max-width:650px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{background:none;border:0;color:#888e9b;padding:8px 2px;font-size:11px;display:grid;gap:3px;justify-items:center}.nav button.active{color:#76b8ff}.nav .symbol{font-size:22px}.entry{border-bottom:1px solid var(--edge);padding:14px 0}.entry:last-child{border-bottom:0}.entry-title{font-size:17px;font-weight:650}.entry-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.entry-actions button{padding:9px 12px;font-size:13px;min-height:39px}.footer-actions{display:flex;gap:9px;margin-top:20px}.footer-actions button{flex:1}.empty{text-align:center;padding:32px 10px;color:var(--sub)}.med-card{background:#21242c;border:1px solid #353945;border-radius:17px;padding:14px;margin:10px 0}.med-card h3{margin-bottom:6px}.number{font-size:28px;font-weight:700;min-width:32px;text-align:center}.hidden{display:none!important}.banner{border-radius:13px;padding:12px 14px;background:#193249;color:#c7e4ff;font-size:13px}.warning{color:#ffbf9d}.report{white-space:pre-wrap;font-size:14px;line-height:1.6;background:#20232a;padding:15px;border-radius:15px;overflow-wrap:anywhere}.divider{height:1px;background:var(--edge);margin:18px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#242832;border-radius:14px;padding:14px}.stat strong{display:block;font-size:26px}.stat span{font-size:12px;color:var(--sub)}.hide{display:none}#printArea{display:none}@media print{body{background:#fff!important;color:#111!important;font:11pt Arial,sans-serif}header,main,.nav{display:none!important}#printArea{display:block!important;white-space:pre-wrap;padding:15mm;line-height:1.5;color:#111} @page{size:A4;margin:12mm}}
</style></head><body><header><div class="eyebrow">Mein Kopfschmerztagebuch</div><h1>KST<span style="color:#0a84ff">.</span></h1></header><main id="app"></main><div id="printArea"></div><nav class="nav"><div class="nav-inner"><button data-nav="home"><span class="symbol">⌂</span>Start</button><button data-nav="history"><span class="symbol">▤</span>Verlauf</button><button data-nav="report"><span class="symbol">▥</span>Auswertung</button><button data-nav="settings"><span class="symbol">⚙</span>Daten</button></div></nav><script>
'use strict';const KEY='kst_v2_records',DAYKEY='kst_v2_days',app=document.getElementById('app');let view='home',step=0,editId=null,detailOnly=false,form=null,reportRange='all',customFrom='',customTo='',reportOutput='';const DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];const FIELDS=[{key:'start',title:'Wann haben die Kopfschmerzen begonnen?',help:'Datum und Uhrzeit kannst du bei Bedarf ändern.',type:'datetime'},{key:'location',title:'Wo sitzt der Schmerz?',help:'Mehrere Bereiche möglich.',type:'multi',options:['Rechte Schläfe','Linke Schläfe','Stirn','Hinterkopf','Nacken / Schulter','Beidseitig','Anderswo']},{key:'severity',title:'Wie stark ist der Schmerz?',help:'0 = kein Schmerz, 10 = stärkster vorstellbarer Schmerz.',type:'scale'},{key:'quality',title:'Wie fühlt sich der Schmerz an?',type:'multi',options:['Dumpf / drückend','Pochend / pulsierend','Stechend','Ziehend / spannend','Anders']},{key:'symptoms',title:'Welche Begleitsymptome hast du?',type:'multi',options:['Keine','Übelkeit','Lichtempfindlichkeit','Lärmempfindlichkeit','Schwindel / wackelig','Sehstörungen / Aura','Erbrechen','Andere']},{key:'impact',title:'Wie sehr beeinträchtigt dich der Schmerz?',type:'single',options:['Kaum','Alltag eingeschränkt','Muss mich hinlegen','Arbeit / Alltag nicht möglich']},{key:'meds',title:'Hast du etwas dagegen eingenommen?',help:'Mehrere Medikamente möglich. Jedes bekommt eigene Angaben.',type:'meds'},{key:'status',title:'Sind die Kopfschmerzen noch da?',type:'single',options:['Noch vorhanden','Abgeklungen']}];const EXTRAS=[{key:'dayType',title:'War es ein Arbeits- oder freier Tag?',type:'single',options:['Arbeitstag','Freier Tag','Urlaub / Feiertag']},{key:'sleep',title:'Wie war dein Schlaf davor?',type:'single',options:['Gut','Mittel','Schlecht','Unklar']},{key:'sleepHours',title:'Wie viele Stunden hast du geschlafen?',type:'number',placeholder:'z. B. 7,5',min:0,max:24},{key:'wake',title:'Wann bist du aufgewacht?',type:'time'},{key:'water',title:'Wie viel hast du vorher getrunken?',type:'single',options:['Wenig','Normal','Viel','Unklar']},{key:'coffee',title:'Wie viel Kaffee hattest du vorher?',type:'single',options:['Keinen','1 Tasse','2–3 Tassen','4+ Tassen','Unklar']},{key:'triggers',title:'Welche möglichen Einflussfaktoren gab es?',type:'multi',options:['Stress','Hitze / Wetter','Mahlzeit ausgelassen','Alkohol am Vorabend','Wenig Schlaf','Entspannungsphase','Unklar']},{key:'night',title:'Gab es Auffälligkeiten nach der Nacht?',type:'multi',options:['Keine bemerkt','Zungenbiss','Ungewöhnliche Verletzung / Schmerzen','Verwirrtheit / Erinnerungslücke','Andere']},{key:'movement',title:'Wird es durch Bewegung schlimmer?',type:'single',options:['Ja','Nein','Besser durch Bewegung','Nicht ausprobiert']},{key:'notes',title:'Möchtest du etwas ergänzen?',type:'textarea'}];const MEDS=['Novalgin','Ibuprofen','Migräne Nasenspray','Anderes'];const STRENGTH={'Novalgin':['500 mg','1.000 mg'],'Ibuprofen':['200 mg','400 mg','600 mg','800 mg'],'Migräne Nasenspray':['10 mg','20 mg']};const OTHER=['Paracetamol','ASS','Naproxen','Diclofenac','Sumatriptan','Rizatriptan','Anderes'];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function get(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch{return []}}function put(key,x){try{localStorage.setItem(key,JSON.stringify(x));return true}catch{alert('Speichern fehlgeschlagen. Prüfe den verfügbaren Gerätespeicher.');return false}}function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}function localNow(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function dateKey(v){return String(v||'').slice(0,10)}function dateObj(v){return new Date(v)}function weekday(v){let d=dateObj(v);return Number.isNaN(+d)?'Unbekannt':DAYS[d.getDay()]}function isWeekend(v){let d=dateObj(v).getDay();return d===0||d===6}function nice(v){if(!v)return '—';const d=dateObj(v);return Number.isNaN(+d)?esc(v):`${weekday(v)}, ${d.toLocaleDateString('de-DE')} · ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`}function shortDate(v){let d=dateObj(v);return Number.isNaN(+d)?String(v):`${weekday(v)}, ${d.toLocaleDateString('de-DE')}`}function list(v){return Array.isArray(v)?v.join(', ')||'—':v||'—'}function btn(label,action,kind='secondary',extra=''){return `<button class="btn ${kind}" data-action="${action}" ${extra}>${label}</button>`}function newForm(){return {id:uid(),start:localNow(),location:[],severity:null,quality:[],symptoms:[],impact:null,meds:[],status:null,end:'',events:[],details:{},createdAt:new Date().toISOString()}}function setView(v){view=v;render();window.scrollTo(0,0)}function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view||(view==='wizard'&&b.dataset.nav==='home')||(view==='details'&&b.dataset.nav==='history')));app.innerHTML=view==='home'?home():view==='history'?history():view==='wizard'?wizard():view==='details'?details():view==='report'?report():settings();bind()}
function home(){let entries=get(KEY).sort((a,b)=>b.start.localeCompare(a.start)),ongoing=entries.filter(x=>x.status!=='Abgeklungen');let today=dateKey(localNow()),day=get(DAYKEY).find(x=>x.date===today);return `<div class="card hero"><div class="eyebrow">Dein Überblick</div><h2 style="margin:12px 0 6px">Wie geht es dir heute?</h2><p class="muted" style="margin-top:0">${shortDate(localNow())}${isWeekend(localNow())?' · Wochenende':''}</p>${btn('＋ Neue Kopfschmerzepisode','new','full')}</div>${ongoing.length?`<div class="card"><h3>Noch offene Episoden</h3>${ongoing.map(x=>`<div class="entry"><div class="entry-title">${esc(shortDate(x.start))}</div><div class="muted small">${esc(list(x.location))} · Stärke ${esc(x.severity??'—')}/10</div><div class="entry-actions">${btn('Aktualisieren','update:'+x.id)}${btn('Abschließen','finish:'+x.id,'ghost')}</div></div>`).join('')}</div>`:''}<div class="card"><h3>Tagesstatus · ${esc(shortDate(localNow()))}</h3><p class="muted small">Auch beschwerdefreie Tage erfassen – wichtig für den Vergleich von Wochenenden und Werktagen.</p><div class="grid2"><button class="choice ${day?.status==='Nein'?'selected':''}" data-day="Nein">✓ Keine Kopfschmerzen</button><button class="choice ${day?.status==='Ja'?'selected':''}" data-day="Ja">Kopfschmerzen</button></div>${day?`<p class="small muted">Gespeichert: ${day.status==='Nein'?'Beschwerdefrei':'Kopfschmerzen'}</p>`:''}</div><div class="grid2"><button class="card" data-action="history" style="color:inherit;text-align:left"><div style="font-size:27px;color:#74b8ff">▤</div><h3>Verlauf</h3><div class="muted small">${entries.length} Episoden im Archiv</div></button><button class="card" data-action="report" style="color:inherit;text-align:left"><div style="font-size:27px;color:#74b8ff">▥</div><h3>Auswertung</h3><div class="muted small">Bericht und PDF</div></button></div><p class="small muted">Deine Daten werden lokal auf diesem iPhone gespeichert. Bitte regelmäßig unter „Daten“ sichern.</p>`}
function history(){let entries=get(KEY).sort((a,b)=>b.start.localeCompare(a.start));return `<h2>Verlauf & Archiv</h2><p class="muted small">Alle Episoden bleiben hier erhalten und können später ergänzt oder korrigiert werden.</p><div class="card">${entries.length?entries.map(x=>`<div class="entry"><div class="row between"><div class="entry-title">${esc(shortDate(x.start))}</div><span class="pill ${x.status==='Abgeklungen'?'green':'blue'}">${esc(x.status||'Offen')}</span></div><div class="small muted">${esc(new Date(x.start).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))} Uhr · ${isWeekend(x.start)?'Wochenende':'Werktag'} · Stärke ${esc(x.severity??'—')}/10</div><p class="small">${esc(list(x.location))} · ${esc(list(x.symptoms))}</p><div class="entry-actions">${btn('Ansehen / Bearbeiten','edit:'+x.id)}${btn('Weitere Details','extra:'+x.id,'ghost')}${btn('Aktualisieren','update:'+x.id,'ghost')}</div></div>`).join(''):'<div class="empty">Noch keine Episoden gespeichert.</div>'}</div>`}
function fieldUI(f,val,extra=false){if(f.type==='datetime'||f.type==='time'||f.type==='number'){let type=f.type==='datetime'?'datetime-local':f.type;return `<input id="fieldInput" type="${type}" ${f.type==='number'?'step="0.5"':''} value="${esc(val??'')}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} placeholder="${esc(f.placeholder||'')}">`}if(f.type==='textarea')return `<textarea id="fieldInput" placeholder="Optionaler Hinweis">${esc(val||'')}</textarea>`;if(f.type==='scale')return `<div class="grid3" style="grid-template-columns:repeat(4,1fr)">${Array.from({length:11},(_,i)=>`<button class="choice ${Number(val)===i&&val!==null?'selected':''}" data-pick="${i}">${i}</button>`).join('')}</div>`;if(f.type==='meds')return medUI();return `<div class="grid2">${f.options.map(o=>`<button class="choice ${f.type==='multi'?(Array.isArray(val)&&val.includes(o)?'selected':''):val===o?'selected':''}" data-pick="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
function medUI(){let meds=form.meds||[];return `<div class="grid2">${MEDS.map(m=>`<button class="choice ${meds.some(x=>x.name===m)?'selected':''} ${m==='Migräne Nasenspray'?'tiny':''}" data-med="${esc(m)}">${esc(m)}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="choice tiny ${meds.length===0?'selected':''}" data-action="no-meds">Keine Medikamente</button></div>${meds.map((m,i)=>`<div class="med-card"><div class="row between"><h3>${esc(m.name)}</h3><button class="btn ghost" style="padding:6px 10px;min-height:35px" data-action="remove-med:${i}">Entfernen</button></div>${m.name==='Anderes'?`<label class="label">Welches Medikament?</label><select data-medfield="${i}:other">${OTHER.map(o=>`<option ${m.other===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${m.other==='Anderes'?`<input style="margin-top:8px" data-medfield="${i}:custom" value="${esc(m.custom||'')}" placeholder="Name eingeben">`:''}`:''}<label class="label">${m.name==='Migräne Nasenspray'?'Anwendungen':'Anzahl Tabletten'}</label><div class="row between"><button class="choice tiny" style="width:52px" data-action="count:${i}:-1">−</button><div class="number">${m.count||1}</div><button class="choice tiny" style="width:52px" data-action="count:${i}:1">＋</button></div><label class="label">Wirkstärke pro ${m.name==='Migräne Nasenspray'?'Anwendung':'Tablette'}</label><div class="grid3">${(STRENGTH[m.name]||[]).concat('Andere').map(s=>`<button class="choice tiny ${m.strength===s?'selected':''}" data-strength="${i}:${esc(s)}">${esc(s)}</button>`).join('')}</div>${m.strength==='Andere'||m.name==='Anderes'?`<input style="margin-top:9px" data-medfield="${i}:customStrength" value="${esc(m.customStrength||'')}" placeholder="Wirkstärke (z. B. 250 mg)">`:''}<label class="label">Einnahmezeit (optional)</label><input type="time" data-medfield="${i}:time" value="${esc(m.time||'')}"></div>`).join('')}`}
function wizard(){let fields=detailOnly?EXTRAS:FIELDS,f=fields[step],val=detailOnly?form.details?.[f.key]:form[f.key];return `<div class="row between"><span class="eyebrow">${detailOnly?'Weitere Details':'Episode erfassen'}</span><span class="small muted">${step+1} / ${fields.length}</span></div><div class="stepbar"><div style="width:${(step+1)/fields.length*100}%"></div></div><div class="card" style="min-height:290px"><h2>${esc(f.title)}</h2>${f.help?`<p class="muted small">${esc(f.help)}</p>`:''}${fieldUI(f,val,detailOnly)}${f.key==='status'&&form.status==='Abgeklungen'?`<label class="label">Wann waren die Kopfschmerzen vorbei? (optional)</label><input id="endInput" type="datetime-local" value="${esc(form.end||'')}">`:''}</div><div class="footer-actions">${btn(step===0?'Abbrechen':'Zurück','back','secondary')}${btn(step===fields.length-1?(detailOnly?'Details speichern':'Weiter zum Speichern'):'Weiter','next','primary')}</div><p class="muted small" style="text-align:center">${f.key==='start'?'Beginn ist erforderlich.':'Andere Fragen kannst du ohne Auswahl überspringen.'}</p>`}
function details(){let x=form;return `<h2>Episode gespeichert</h2><div class="card"><span class="pill green">Gespeichert</span><h3 style="margin-top:12px">${esc(shortDate(x.start))}</h3><p class="muted">${esc(list(x.location))} · Stärke ${esc(x.severity??'—')}/10</p><div class="stack">${btn('Fertig · Zur Übersicht','home','full')}${btn('Jetzt weitere Details erfassen','start-details','secondary')}${btn('Episode später aktualisieren','history','ghost')}</div></div><p class="muted small">Die optionalen Angaben kannst du jederzeit im Verlauf nachtragen.</p>`}
function settings(){return `<h2>Daten & Sicherung</h2><div class="card"><h3>Dein Archiv sichern</h3><p class="muted small">Die Einträge bleiben auf diesem Gerät im lokalen Webspeicher. Beim Löschen von Safari-Websitedaten oder beim Gerätewechsel können sie verloren gehen. Sichere sie deshalb regelmäßig.</p><div class="stack">${btn('Vollständige Sicherung (JSON)','backup','full')}${btn('Daten für ChatGPT (JSON)','analysis','secondary')}${btn('Tabellenexport (CSV)','csv','secondary')}</div></div><div class="card"><h3>Sicherung wiederherstellen</h3><input id="restore" type="file" accept=".json,application/json"><p class="small muted">Einträge aus der Sicherung werden hinzugefügt; bereits vorhandene IDs werden nicht überschrieben.</p></div><div class="card"><h3>Datenschutz</h3><p class="small muted">KST benötigt kein Konto und sendet deine Tagebucheinträge nicht an GitHub oder einen anderen Server. Die App-Datei selbst ist öffentlich abrufbar. Wenn du eine Sicherung teilst, enthält sie Gesundheitsdaten – entscheide bewusst, mit wem du sie teilst.</p></div><div class="card"><h3>Hinweis</h3><p class="small muted">KST ist ein Dokumentationswerkzeug und ersetzt keine ärztliche Diagnose. Bei plötzlich extrem starkem Kopfschmerz oder neuen neurologischen Ausfällen sofort medizinische Hilfe suchen.</p></div>`}
function rangeData(){const all=get(KEY),days=get(DAYKEY);let start='',end='';const today=dateKey(localNow());if(reportRange==='7'||reportRange==='30'){let d=new Date(today+'T12:00:00');d.setDate(d.getDate()-(Number(reportRange)-1));start=dateKey(d.toISOString());end=today}else if(reportRange==='custom'){start=customFrom;end=customTo}return {entries:all.filter(x=>(!start||dateKey(x.start)>=start)&&(!end||dateKey(x.start)<=end)).sort((a,b)=>a.start.localeCompare(b.start)),days:days.filter(x=>(!start||x.date>=start)&&(!end||x.date<=end)),start,end}}
function report(){let data=rangeData();return `<h2>Auswertung</h2><div class="card"><h3>Zeitraum auswählen</h3><div class="stack">${[['all','Seit Beginn des Tagebuchs'],['7','Letzte 7 Tage'],['30','Letzte 30 Tage'],['custom','Zeitraum selbst wählen']].map(([v,l])=>`<button class="choice ${reportRange===v?'selected':''}" data-range="${v}">${l}</button>`).join('')}</div>${reportRange==='custom'?`<div class="grid2"><div><label class="label">Von</label><input type="date" id="from" value="${esc(customFrom)}"></div><div><label class="label">Bis</label><input type="date" id="to" value="${esc(customTo)}"></div></div>`:''}<div style="margin-top:15px">${btn('Bericht erstellen','make-report','full')}</div></div>${reportOutput?`<div class="card"><h3>Dein Bericht</h3><div class="report">${esc(reportOutput)}</div><div class="stack" style="margin-top:13px">${btn('Als PDF sichern / drucken','print','full')}${btn('Bericht als Text herunterladen','txt','secondary')}${btn('Bericht kopieren','copy','ghost')}</div></div>`:`<p class="muted small">Der Bericht berücksichtigt ausdrücklich Wochentage, Wochenenden und dokumentierte beschwerdefreie Tage.</p>`}`}
function makeReport(){let {entries,days,start,end}=rangeData(),sev=entries.filter(x=>x.severity!==null&&x.severity!==undefined&&x.severity!==''),avg=sev.length?(sev.reduce((a,x)=>a+Number(x.severity),0)/sev.length).toFixed(1).replace('.',','):'—';let weekdayCounts=DAYS.map((d,i)=>({name:d,count:entries.filter(x=>new Date(x.start).getDay()===i).length}));let week=entries.filter(x=>isWeekend(x.start)).length;let dayNo=days.filter(x=>x.status==='Nein').length,dayYes=days.filter(x=>x.status==='Ja').length;let daysWeekend=days.filter(x=>isWeekend(x.date+'T12:00:00')),daysWeekday=days.filter(x=>!isWeekend(x.date+'T12:00:00'));let dayStat=d=>`${d.filter(x=>x.status==='Ja').length} mit Kopfschmerzen, ${d.filter(x=>x.status==='Nein').length} ohne (von ${d.length} dokumentierten Tagen)`;let count=(key,inner=false)=>{let m={};entries.forEach(x=>{let v=inner?x.details?.[key]:x[key];(Array.isArray(v)?v:v?[v]:[]).forEach(z=>m[z]=(m[z]||0)+1)});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}: ${v}`).join(' · ')||'Keine Angaben'};let durations=entries.filter(x=>x.end&&x.start).map(x=>(+new Date(x.end)- +new Date(x.start))/36e5).filter(x=>x>=0);let meds={};entries.forEach(x=>(x.meds||[]).forEach(m=>{let name=m.name==='Anderes'?(m.custom||m.other||'Anderes'):m.name;meds[name]=(meds[name]||0)+1}));let period=start||end?`${start||'Beginn'} bis ${end||'heute'}`:'Gesamtes Tagebuch';let lines=[`KST · KOPFSCHMERZTAGEBUCH`,`Bericht erstellt am ${new Date().toLocaleString('de-DE')}`,`Zeitraum: ${period}`,'',`DOKUMENTATION`,`Kopfschmerzepisoden: ${entries.length}`,`Schmerzstärke im Mittel: ${avg}/10 (${sev.length} bewertete Episoden)`,`Abgeschlossene Episoden mit Dauerangabe: ${durations.length}${durations.length?'; mittlere Dauer '+(durations.reduce((a,b)=>a+b,0)/durations.length).toFixed(1).replace('.',',')+' Stunden':''}`,`Tagesstatus: ${dayYes} Tage mit / ${dayNo} Tage ohne Kopfschmerzen (${days.length} dokumentiert)`,'',`WOCHENTAGE UND WOCHENENDEN`,...weekdayCounts.map(x=>`${x.name}: ${x.count} Episode(n)`),`Am Wochenende: ${week} von ${entries.length} Episoden`,`An Werktagen: ${entries.length-week} von ${entries.length} Episoden`,`Dokumentierte Wochenendtage: ${dayStat(daysWeekend)}`,`Dokumentierte Werktage: ${dayStat(daysWeekday)}`,'Hinweis: Nicht dokumentierte Tage gelten NICHT als beschwerdefrei. Episodenhäufigkeit allein belegt kein erhöhtes Wochenendrisiko.','',`BEOBACHTETE MERKMALE`,`Schmerzorte: ${count('location')}`,`Schmerzarten: ${count('quality')}`,`Begleitsymptome: ${count('symptoms')}`,`Beeinträchtigung: ${count('impact')}`,`Arbeitstag / frei (falls erfasst): ${count('dayType',true)}`,`Schlaf: ${count('sleep',true)}`,`Mögliche Faktoren: ${count('triggers',true)}`,`Nächtliche Auffälligkeiten: ${count('night',true)}`,`Dokumentierte Medikamente: ${Object.entries(meds).map(([k,v])=>k+': '+v).join(' · ')||'Keine'}`,'',`EPISODEN IM ZEITRAUM`,...entries.map(x=>`${nice(x.start)}${isWeekend(x.start)?' [WOCHENENDE]':''} | Stärke ${x.severity??'—'}/10 | ${list(x.location)} | ${x.status||'Status offen'} | ${x.meds?.length?x.meds.map(m=>`${m.name==='Anderes'?(m.custom||m.other||'Anderes'):m.name} ${m.count||1} × ${m.customStrength||m.strength||'Stärke unbekannt'}`).join(' + '):'Keine Medikamente dokumentiert'}${x.end?' | Ende: '+nice(x.end):''}`),'',`Dies ist eine Zusammenfassung selbst dokumentierter Angaben und keine medizinische Diagnose.`];return lines.join('\n')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}function exportData(){return {format:'KST-2.0',exportedAt:new Date().toISOString(),episodes:get(KEY),dailyStatus:get(DAYKEY)}}function csvCell(v){if(Array.isArray(v)||typeof v==='object'&&v!==null)v=JSON.stringify(v);return '"'+String(v??'').replace(/"/g,'""')+'"'}function save(){let a=get(KEY),i=a.findIndex(x=>x.id===form.id);if(i<0)a.push(form);else a[i]=form;if(put(KEY,a))return true;return false}
function bind(){app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let f=(detailOnly?EXTRAS:FIELDS)[step],target=detailOnly?form.details:form,v=b.dataset.pick;if(f.type==='multi'){let a=target[f.key]||[];if(['Keine','Keine bemerkt'].includes(v))a=[];else a=a.filter(x=>!['Keine','Keine bemerkt'].includes(x));target[f.key]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else target[f.key]=f.type==='scale'?Number(v):v;render()});app.querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>{let name=b.dataset.med,ix=form.meds.findIndex(x=>x.name===name);if(ix>=0)form.meds.splice(ix,1);else form.meds.push({name,count:1,strength:STRENGTH[name]?.[0]||'Andere',other:'Paracetamol',custom:'',customStrength:'',time:''});render()});app.querySelectorAll('[data-strength]').forEach(b=>b.onclick=()=>{let [i,...s]=b.dataset.strength.split(':');form.meds[+i].strength=s.join(':');render()});app.querySelectorAll('[data-medfield]').forEach(e=>e.onchange=()=>{let [i,key]=e.dataset.medfield.split(':');form.meds[+i][key]=e.value;if(key==='other')render()});app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let d=dateKey(localNow()),a=get(DAYKEY),ix=a.findIndex(x=>x.date===d),item={date:d,status:b.dataset.day,updatedAt:new Date().toISOString()};if(ix<0)a.push(item);else a[ix]=item;put(DAYKEY,a);render()});app.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{reportRange=b.dataset.range;reportOutput='';render()});const restore=document.getElementById('restore');if(restore)restore.onchange=async()=>{let f=restore.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.episodes)||!Array.isArray(data.dailyStatus))throw Error('Ungültiges Format');if(!confirm('Sicherung importieren? Bereits vorhandene Einträge bleiben erhalten.'))return;let a=get(KEY),ids=new Set(a.map(x=>x.id)),n=0;data.episodes.forEach(x=>{if(x&&typeof x.id==='string'&&typeof x.start==='string'&&!ids.has(x.id)){a.push(x);ids.add(x.id);n++}});let d=get(DAYKEY),existing=new Set(d.map(x=>x.date));data.dailyStatus.forEach(x=>{if(x&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&['Ja','Nein'].includes(x.status)&&!existing.has(x.date)){d.push(x);existing.add(x.date)}});put(KEY,a);put(DAYKEY,d);alert(n+' Episoden importiert.');render()}catch(e){alert('Diese Datei ist keine gültige KST-Sicherung.')}}}
function persistInput(){if(view!=='wizard')return;let f=(detailOnly?EXTRAS:FIELDS)[step],t=detailOnly?form.details:form,input=document.getElementById('fieldInput');if(input)t[f.key]=input.value;if(f.key==='status'){let end=document.getElementById('endInput');if(end)form.end=end.value}app.querySelectorAll('[data-medfield]').forEach(e=>{let [i,key]=e.dataset.medfield.split(':');form.meds[+i][key]=e.value})}
function action(a){if(a==='home'||a==='history'||a==='report'||a==='settings'){setView(a);return}if(a==='new'){form=newForm();editId=null;detailOnly=false;step=0;setView('wizard');return}if(a.startsWith('edit:')||a.startsWith('extra:')){let id=a.split(':')[1],x=get(KEY).find(x=>x.id===id);if(!x)return;form=structuredClone(x);form.details||={};form.meds||=[];form.events||=[];editId=id;detailOnly=a.startsWith('extra:');step=0;setView('wizard');return}if(a==='back'){persistInput();if(step>0){step--;render()}else{if(confirm('Erfassung verlassen? Noch nicht gespeicherte Änderungen gehen verloren.'))setView(editId?'history':'home')}return}if(a==='next'){persistInput();if(!detailOnly&&step===0&&!form.start){alert('Bitte Beginn eintragen.');return}if(step<(detailOnly?EXTRAS:FIELDS).length-1){step++;render()}else{if(!detailOnly){if(!save())return;setView('details')}else{if(save()){alert('Zusätzliche Details gespeichert.');setView('history')}}}return}if(a==='start-details'){detailOnly=true;step=0;form.details||={};setView('wizard');return}if(a==='no-meds'){form.meds=[];render();return}if(a.startsWith('remove-med:')){form.meds.splice(+a.split(':')[1],1);render();return}if(a.startsWith('count:')){let [,i,d]=a.split(':');form.meds[+i].count=Math.max(1,Math.min(99,(form.meds[+i].count||1)+Number(d)));render();return}if(a.startsWith('update:')){let x=get(KEY).find(x=>x.id===a.split(':')[1]);if(x)updateEpisode(x);return}if(a.startsWith('finish:')){let id=a.split(':')[1],arr=get(KEY),x=arr.find(x=>x.id===id);if(x&&confirm('Episode jetzt als abgeklungen markieren?')){x.status='Abgeklungen';x.end=localNow();put(KEY,arr);render()}return}if(a==='make-report'){if(reportRange==='custom'){customFrom=document.getElementById('from')?.value||'';customTo=document.getElementById('to')?.value||'';if(!customFrom||!customTo||customFrom>customTo){alert('Bitte einen gültigen Zeitraum von/bis auswählen.');return}}reportOutput=makeReport();render();return}if(a==='print'){document.getElementById('printArea').textContent=reportOutput;window.print();return}if(a==='txt'){download('KST-Bericht.txt',reportOutput,'text/plain;charset=utf-8');return}if(a==='copy'){navigator.clipboard?.writeText(reportOutput).then(()=>alert('Bericht kopiert.')).catch(()=>alert('Kopieren nicht verfügbar. Bitte Text manuell auswählen.'));return}if(a==='backup'||a==='analysis'){download(a==='backup'?'KST-Sicherung.json':'KST-Daten-fuer-Analyse.json',JSON.stringify(exportData(),null,2),'application/json');return}if(a==='csv'){let data=get(KEY),cols=['start','end','status','severity','location','quality','symptoms','impact','meds','details','events'];let rows=[['Wochentag','Wochenende',...cols].map(csvCell).join(';'),...data.map(x=>[weekday(x.start),isWeekend(x.start)?'Ja':'Nein',...cols.map(c=>x[c])].map(csvCell).join(';'))];download('KST-Episoden.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');return}}
function updateEpisode(x){let meds=x.meds||[],opts=['Schmerzstärke aktualisieren','Medikament / Maßnahme hinzufügen','Wirkung dokumentieren','Episode abschließen','Abbrechen'];let choice=prompt('Episode: '+nice(x.start)+'\n\n1 · '+opts[0]+'\n2 · '+opts[1]+'\n3 · '+opts[2]+'\n4 · '+opts[3]+'\n\nBitte 1–4 eingeben:');if(!choice)return;let arr=get(KEY),item=arr.find(y=>y.id===x.id);if(!item)return;item.events||=[];if(choice==='1'){let v=prompt('Aktuelle Schmerzstärke 0–10:',String(item.severity??''));if(v===null)return;if(!/^([0-9]|10)$/.test(v.trim())){alert('Bitte 0 bis 10 eingeben.');return}item.severity=Number(v);item.events.push({at:new Date().toISOString(),type:'Schmerzstärke',value:v})}else if(choice==='2'){let name=prompt('Medikament oder Maßnahme (z. B. Novalgin 1 × 500 mg, Wasser, Ruhe):');if(!name?.trim())return;item.events.push({at:new Date().toISOString(),type:'Medikament / Maßnahme',value:name.trim()})}else if(choice==='3'){let v=prompt('Wie hat sich der Schmerz verändert? (z. B. deutlich besser, nach 45 Minuten):');if(!v?.trim())return;item.events.push({at:new Date().toISOString(),type:'Wirkung / Verlauf',value:v.trim()})}else if(choice==='4'){item.status='Abgeklungen';item.end=localNow();item.events.push({at:new Date().toISOString(),type:'Episode beendet',value:''})}else return;put(KEY,arr);render();alert('Aktualisierung gespeichert.')}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));render();
</script></body></html>
